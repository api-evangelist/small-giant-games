description: 'Small Giant Games is a Helsinki, Finland based mobile game studio best known for the
  hit puzzle-RPG Empires & Puzzles. Founded in 2013, the studio was acquired by Zynga in 2018 (now
  part of Take-Two Interactive) and continues to operate its live free-to-play mobile titles. As a
  consumer mobile gaming company it publishes player-facing games and support resources rather than a
  public developer API. This profile was surfaced as a portfolio company of Creandum and EQT Ventures
  and processed by the API Evangelist enrichment pipeline, which found no public API, developer portal,
  OpenAPI, package/SDK, or /.well-known discovery surface — only a live consumer marketing website.'
